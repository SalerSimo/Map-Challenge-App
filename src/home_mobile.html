<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polito Navigation App</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="../src/style_mobile.css">
    <script defer src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    
    <script type="module" src="../src/script.js"></script>

</head>
<body onload="init()">
    <div class="phone">
        <div class="main-container" style="gap: 10px; padding-bottom: 80px;">
            <div id="map" class="map-container" style="margin-top: 10px;">
                <select class="select-floor" name="floor" id="floor"></select>
            </div>
            <div class="input" onclick="window.location.href='../src/input.html'" style="box-sizing: border-box; padding: 0px 5px; display: flex; align-items: center;">
                <img src="../src/img/search-icon.svg" alt="" style="height: 75%;">
                <span style="padding: 5px 10px;">What are you looking for?</span>
            </div>
        </div>
        <div class="go-home"></div>
    </div>
</body>
</html>
